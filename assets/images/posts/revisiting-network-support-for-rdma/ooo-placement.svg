<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="820" height="410" fill="#ffffff"/>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">Out-of-order placement: write each packet straight to its place, remember it in a bitmap</text>
<text x="20.0" y="50.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">A 4-packet RDMA Write, PSNs 20 to 23. PSN 21 is lost on its first try.</text>
<text x="20.0" y="76.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Arrival order →</text>
<rect x="40.0" y="84.0" width="120.0" height="42.0" rx="4" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="100.0" y="102.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 20 · first</text>
<rect x="52.0" y="108.0" width="96.0" height="13.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
<text x="100.0" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2f9e44" font-weight="bold">+ address (RETH)</text>
<rect x="190.0" y="84.0" width="120.0" height="42.0" rx="4" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="250.0" y="102.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 22</text>
<rect x="202.0" y="108.0" width="96.0" height="13.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
<text x="250.0" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2f9e44" font-weight="bold">+ address (RETH)</text>
<rect x="340.0" y="84.0" width="120.0" height="42.0" rx="4" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="400.0" y="102.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 23 · last</text>
<rect x="352.0" y="108.0" width="96.0" height="13.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
<text x="400.0" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2f9e44" font-weight="bold">+ address (RETH)</text>
<rect x="580.0" y="84.0" width="120.0" height="42.0" rx="4" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="640.0" y="102.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 21 · resent</text>
<rect x="592.0" y="108.0" width="96.0" height="13.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
<text x="640.0" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2f9e44" font-weight="bold">+ address (RETH)</text>
<text x="520.0" y="109.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">··· a round trip later</text>
<text x="20.0" y="350.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Application buffer at address A, in host memory: every packet lands in place</text>
<rect x="40.0" y="286.0" width="130.0" height="46.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="105.0" y="305.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">A + 0 KB</text>
<text x="105.0" y="321.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 20's data</text>
<rect x="175.0" y="286.0" width="130.0" height="46.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="240.0" y="305.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">A + 1 KB</text>
<text x="240.0" y="321.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 21's data</text>
<rect x="310.0" y="286.0" width="130.0" height="46.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="375.0" y="305.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">A + 2 KB</text>
<text x="375.0" y="321.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 22's data</text>
<rect x="445.0" y="286.0" width="130.0" height="46.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="510.0" y="305.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">A + 3 KB</text>
<text x="510.0" y="321.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">PSN 23's data</text>
<line x1="100.0" y1="128.0" x2="105.0" y2="283.0" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<line x1="250.0" y1="128.0" x2="375.0" y2="283.0" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<line x1="400.0" y1="128.0" x2="510.0" y2="283.0" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<line x1="640.0" y1="128.0" x2="240.0" y2="283.0" stroke="#1971c2" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="176.0" y="200.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">DMA to its own address,</text>
<text x="176.0" y="215.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">no reordering buffer</text>
<text x="610.0" y="170.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">In the NIC: the 2-bitmap</text>
<text x="610.0" y="184.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">starts at the next expected PSN, 21</text>
<text x="682.0" y="202.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">21</text>
<text x="706.0" y="202.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">22</text>
<text x="730.0" y="202.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">23</text>
<text x="754.0" y="202.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">24</text>
<text x="778.0" y="202.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">25</text>
<text x="664.0" y="223.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">arrived</text>
<rect x="670.0" y="208.0" width="22.0" height="22.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="681.0" y="223.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">0</text>
<rect x="694.0" y="208.0" width="22.0" height="22.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2"/>
<text x="705.0" y="223.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">1</text>
<rect x="718.0" y="208.0" width="22.0" height="22.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2"/>
<text x="729.0" y="223.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">1</text>
<rect x="742.0" y="208.0" width="22.0" height="22.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="753.0" y="223.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">0</text>
<rect x="766.0" y="208.0" width="22.0" height="22.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="777.0" y="223.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">0</text>
<text x="664.0" y="249.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">ends msg</text>
<rect x="670.0" y="234.0" width="22.0" height="22.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="681.0" y="249.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">0</text>
<rect x="694.0" y="234.0" width="22.0" height="22.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="705.0" y="249.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">0</text>
<rect x="718.0" y="234.0" width="22.0" height="22.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2"/>
<text x="729.0" y="249.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">1</text>
<rect x="742.0" y="234.0" width="22.0" height="22.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="753.0" y="249.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">0</text>
<rect x="766.0" y="234.0" width="22.0" height="22.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="777.0" y="249.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">0</text>
<text x="610.0" y="276.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">23 ends the message, but the MSN update</text>
<text x="610.0" y="289.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">and the completion wait for 21</text>
<text x="20.0" y="376.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Buffering out-of-order packets on the NIC instead: up to 110 packets × 1 KB = 110 KB per QP, or 110 MB for 1,000 QPs.</text>
<text x="20.0" y="394.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">The bitmap costs 2 bits per packet: 256 bits per QP at 40 Gb/s.</text>
</svg>
