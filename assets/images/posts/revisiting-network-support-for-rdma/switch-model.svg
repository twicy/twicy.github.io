<text x="46.0" y="390.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Lookup: on arrival, the switch finds the packet's output from its destination, and queues it at its input, in the queue for that output.</text>
<circle cx="29.0" cy="406.0" r="9" fill="#1971c2"/>
<text x="29.0" y="410.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">2</text>
<text x="46.0" y="410.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Scheduling: each output takes packets from the inputs in turn (round-robin), so a busy output never blocks packets bound elsewhere.</text>
<circle cx="29.0" cy="426.0" r="9" fill="#c92a2a"/>
<text x="29.0" y="430.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">3</text>
<text x="46.0" y="430.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">PFC: each input holds 240 KB. Above 220 KB it pauses the sender upstream; the last 20 KB catches what is still on the wire.</text>
</svg>
