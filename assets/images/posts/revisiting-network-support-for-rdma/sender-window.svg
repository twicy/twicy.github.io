<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 484" width="820" height="484" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="820" height="484" fill="#ffffff"/>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">An IRN sender in loss recovery: what its bitmap says to send next</text>
<rect x="70.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.2"/>
<text x="89.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#868e96" font-weight="normal">0</text>
<rect x="112.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.2"/>
<text x="131.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#868e96" font-weight="normal">1</text>
<rect x="154.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.2"/>
<text x="173.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#868e96" font-weight="normal">2</text>
<rect x="196" y="172" width="38" height="34" rx="3" fill="url(#hatch)" stroke="#c92a2a" stroke-width="1.4"/>
<text x="215.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">3</text>
<rect x="238.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
<text x="257.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">4</text>
<rect x="280.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
<text x="299.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">5</text>
<rect x="322" y="172" width="38" height="34" rx="3" fill="url(#hatch)" stroke="#c92a2a" stroke-width="1.4"/>
<text x="341.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">6</text>
<rect x="364.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
<text x="383.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">7</text>
<rect x="406.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#f1f3f5" stroke="#868e96" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="425.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" font-weight="normal">8</text>
<rect x="448.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#f1f3f5" stroke="#868e96" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="467.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" font-weight="normal">9</text>
<rect x="490.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="509.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">10</text>
<rect x="532.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="551.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">11</text>
<rect x="574.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="593.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">12</text>
<rect x="616.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="635.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#adb5bd" font-weight="normal">13</text>
<rect x="658.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="677.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#adb5bd" font-weight="normal">14</text>
<rect x="700.0" y="172.0" width="38.0" height="34.0" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="719.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#adb5bd" font-weight="normal">15</text>
<text x="60.0" y="194.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">PSN</text>
<path d="M 196.0 160.0 L 196.0 152.0 L 612.0 152.0 L 612.0 160.0" fill="none" stroke="#1971c2" stroke-width="1.8"/>
<text x="404.0" y="146.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1971c2" font-weight="bold">BDP-FC window: PSNs from the cumulative ACK up to ACK + cap − 1 (cap = 10 here; 110 in the paper)</text>
<text x="215.0" y="104.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">cumulative ACK = 3</text>
<text x="215.0" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">(0 to 2 arrived; 3 is next expected)</text>
<rect x="360.0" y="40.0" width="440.0" height="94.0" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="372.0" y="58.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">What came back: one NACK per out-of-order arrival</text>
<text x="372.0" y="77.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">4 arrives, 3 still missing</text>
<text x="532.0" y="77.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">→</text>
<text x="548.0" y="77.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">NACK (cumulative 3, SACK 4)</text>
<text x="372.0" y="92.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">5 arrives</text>
<text x="532.0" y="92.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">→</text>
<text x="548.0" y="92.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">NACK (cumulative 3, SACK 5)</text>
<text x="372.0" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">6 is lost too</text>
<text x="532.0" y="107.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">→</text>
<text x="548.0" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">no NACK: nothing arrived</text>
<text x="372.0" y="122.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">7 arrives</text>
<text x="532.0" y="122.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96" font-weight="normal">→</text>
<text x="548.0" y="122.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">NACK (cumulative 3, SACK 7)</text>
<text x="677.0" y="224.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#868e96" font-weight="normal">blocked by</text>
<text x="677.0" y="237.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#868e96" font-weight="normal">BDP-FC</text>
<circle cx="215.0" cy="224.0" r="9" fill="#c92a2a"/>
<text x="215.0" y="228.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">1</text>
<circle cx="341.0" cy="224.0" r="9" fill="#c92a2a"/>
<text x="341.0" y="228.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">2</text>
<circle cx="509.0" cy="224.0" r="9" fill="#1971c2"/>
<text x="509.0" y="228.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">3</text>
<circle cx="551.0" cy="224.0" r="9" fill="#1971c2"/>
<text x="551.0" y="228.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">4</text>
<circle cx="593.0" cy="224.0" r="9" fill="#1971c2"/>
<text x="593.0" y="228.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">5</text>
<path d="M 467.0 210.0 V 255.0 H 479.0" fill="none" stroke="#212529" stroke-width="1.4"/>
<text x="485.0" y="259.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">recovery sequence = 9</text>
<text x="485.0" y="273.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">last new PSN sent before the first resend;</text>
<text x="485.0" y="286.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">recovery ends once the cumulative ACK passes it</text>
<text x="20.0" y="310.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">What goes out next, in order</text>
<circle cx="29.0" cy="328.0" r="9" fill="#c92a2a"/>
<text x="29.0" y="332.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">1</text>
<text x="56.0" y="332.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">3: the cumulative ACK, always the first resend on entering recovery</text>
<circle cx="29.0" cy="348.0" r="9" fill="#c92a2a"/>
<text x="29.0" y="352.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">2</text>
<text x="56.0" y="352.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">6: presumed lost, because 7 above it was SACKed</text>
<rect x="20.0" y="359.0" width="26.0" height="18.0" rx="9" fill="#1971c2" stroke="#1971c2" stroke-width="0"/>
<text x="33.0" y="372.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">3-5</text>
<text x="56.0" y="372.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">10, 11, 12: new packets, once nothing is left to resend and while the window has room</text>
<text x="56.0" y="392.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">8 and 9 are not resent: nothing above them has been SACKed, so they may still be on the way</text>
<text x="56.0" y="412.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Had the NACKs for 4 and 5 been lost, only 7 would be SACKed, so 4 and 5 would be resent too (harmless copies)</text>
<rect x="20.0" y="430.0" width="16.0" height="14.0" rx="2" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.2"/>
<text x="42.0" y="441.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">ACKed</text>
<rect x="95" y="430" width="16" height="14" rx="2" fill="url(#hatch)" stroke="#c92a2a" stroke-width="1.2"/>
<text x="117.0" y="441.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">presumed lost</text>
<rect x="219.6" y="430.0" width="16.0" height="14.0" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2"/>
<text x="241.6" y="441.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">SACKed</text>
<rect x="300.8" y="430.0" width="16.0" height="14.0" rx="2" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="322.8" y="441.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">sent, no news yet</text>
<rect x="450.2" y="430.0" width="16.0" height="14.0" rx="2" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
<text x="472.2" y="441.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">new, allowed</text>
<rect x="568.6" y="430.0" width="16.0" height="14.0" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="590.6" y="441.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">not allowed yet</text>
<text x="20.0" y="468.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">A lost packet with nothing after it (say, a one-packet message) gets no NACK, so a timeout recovers it: 100 µs with ≤ 3 packets in flight, 320 µs otherwise.</text>
</svg>
