<text x="20.0" y="268.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">IRN without PFC drops 8.5% of its packets and still wins on every metric. Turning PFC on makes IRN worse (by 1.5 to 2×) and RoCE better.</text>
<text x="20.0" y="286.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">RoCE without PFC (≈) is read off the paper's Figure 3; the other values come from the extended version's Table 3.</text>
