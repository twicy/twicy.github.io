<rect width="820" height="300" fill="#ffffff"/>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">Default scenario, no congestion control: IRN without PFC beats RoCE with PFC</text>
<text x="20.0" y="44.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">Lower is better. 54-server fat-tree, 40 Gb/s links, 70% load, heavy-tailed flow sizes.</text>
