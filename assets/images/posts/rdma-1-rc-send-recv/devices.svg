<text x="20.0" y="250.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#283347" text-anchor="start" font-weight="600" dominant-baseline="middle" xml:space="preserve">Not every function maps to one device:</text>
<text x="20.0" y="267.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">· a VF bound to vfio-pci (passed to a VM) has no mlx5_core here, so no device;</text>
<text x="20.0" y="284.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">· devlink param enable_rdma = false: no rdma auxiliary device;</text>
<text x="20.0" y="301.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">· switchdev mode: an rdma-rep device instead, one IB device with a port per vport;</text>
<text x="20.0" y="318.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">· multiport RoCE: PF1 joins mlx5_0 as its port 2 (the &quot;multiport&quot; aux device);</text>
<text x="20.0" y="335.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">· RoCE LAG: both PFs become one mlx5_bond_0 (next figure).</text>
<text x="20.0" y="372.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600" dominant-baseline="middle" xml:space="preserve">ibv_get_device_list() never scans PCI. It asks the kernel:</text>
<rect x="20.0" y="386.0" width="196.0" height="50.0" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2" />
<text x="118.0" y="402.5" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#164e63" text-anchor="middle" font-weight="600" dominant-baseline="middle" xml:space="preserve">RDMA_NLDEV_CMD_GET</text>
