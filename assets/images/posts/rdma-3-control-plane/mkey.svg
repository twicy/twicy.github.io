<text x="20.0" y="372.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#283347" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">address = MTT[(va − ⌊iova⌋) / pg] + va mod pg     (pg = 1 &lt;&lt; log_page_size,</text>
<text x="20.0" y="386.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#283347" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">                                              ⌊iova⌋ = iova rounded down to pg)</text>
<text x="20.0" y="408.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">Bounds, PD and access are checked by the HCA on every access. A bad key or range</text>
<text x="20.0" y="424.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">completes with IBV_WC_LOC_PROT_ERR locally, or a NAK (remote access error) for an rkey.</text>
<text x="20.0" y="446.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">mkey = index &lt;&lt; 8 | variant (a per-device counter at CREATE_MKEY). On dereg, a UMR</text>
<text x="20.0" y="462.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">revokes it (free = 1, PD → the UMR PD) before it goes back to the pool.</text></svg>
