<text x="24.0" y="318.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">PTE 184 = 0x000B8007: frame 0xB8000, same flags. Add the offset: PA = 0x000B8140.</text>
<text x="24.0" y="344.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">PDE 0 holds the same value as PDE 768, so VA 0x000B8140 lands on the same byte.</text></svg>
