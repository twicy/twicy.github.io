<text x="24.0" y="286.0" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#283347" text-anchor="start" font-weight="400" dominant-baseline="middle" xml:space="preserve">so the &quot;page table&quot; is the directory and so is the final frame.</text>
<text x="24.0" y="310.0" font-size="11.5" text-anchor="start" dominant-baseline="middle" xml:space="preserve"><tspan font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#283347" font-weight="600">PTE of va </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#283347" font-weight="400">= *(0xFFC00000 + (va &gt;&gt; 12) × 4)      </tspan><tspan font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#283347" font-weight="600">PDE of va </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#283347" font-weight="400">= *(0xFFFFF000 + (va &gt;&gt; 22) × 4)</tspan></text></svg>
