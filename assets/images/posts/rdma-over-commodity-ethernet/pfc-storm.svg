<text x="20.0" y="372.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">NIC watchdog: the NIC's micro-controller sees the receive pipeline stuck for 100 ms while pauses go out,</text>
<text x="20.0" y="386.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">and stops the NIC from sending pauses. ToR watchdog: a server port that cannot drain and keeps getting pauses</text>
<text x="20.0" y="400.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">is switched to lossy (its lossless packets are dropped) until 200 ms pass without pauses.</text>
<text x="800.0" y="414.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#868e96" font-weight="normal" font-style="italic">arrows point at the device being paused</text>
