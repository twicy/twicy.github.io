<text x="20.0" y="446.0" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="12" fill="#212529" font-weight="normal">The loop: T0.p2 → La.p0 → La.p1 → T1.p3 ⇢ T1.p4 → Lb.p1 → Lb.p0 → T0.p3 ⇢ T0.p2   (⇢ = flooding)</text>
<text x="20.0" y="470.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">Every queue on the loop waits for the next one to drain, and none can. Restarting the servers does not help.</text>
