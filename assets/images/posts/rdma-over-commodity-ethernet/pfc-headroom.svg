<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff4e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e8590c" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="820" height="340" fill="#ffffff"/>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">PFC on one link: XOFF, XON and headroom</text>
<rect x="20.0" y="46.0" width="220.0" height="224.0" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="130.0" y="68.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529" font-weight="bold">Upstream egress port</text>
<text x="130.0" y="84.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">switch or NIC: one queue per priority</text>
<rect x="34.0" y="100.0" width="192.0" height="28.0" rx="4" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.3"/>
<text x="44.0" y="118.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">priority 3: lossless, paused</text>
<rect x="34.0" y="138.0" width="192.0" height="28.0" rx="4" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="44.0" y="156.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">priority 4: lossless</text>
<rect x="34.0" y="176.0" width="192.0" height="28.0" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="44.0" y="194.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">priority 0: lossy (TCP)</text>
<text x="130.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">… 8 priorities in all</text>
<line x1="244.0" y1="132.0" x2="476.0" y2="132.0" stroke="#1971c2" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="360.0" y="122.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">data packets, priority 3</text>
<line x1="476.0" y1="196.0" x2="244.0" y2="196.0" stroke="#c92a2a" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="360.0" y="186.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c92a2a" font-weight="bold">PAUSE (priority 3, time)</text>
<text x="360.0" y="214.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">resume = PAUSE with time 0</text>
<text x="360.0" y="252.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">cable: 2 m to 300 m</text>
<rect x="480.0" y="46.0" width="320.0" height="224.0" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="640.0" y="68.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529" font-weight="bold">Downstream ingress port</text>
<text x="640.0" y="84.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">one counter per priority, in a shared buffer</text>
<rect x="500.0" y="100.0" width="56.0" height="156.0" rx="0" fill="#ffffff" stroke="#495057" stroke-width="1.3"/>
<rect x="500.0" y="100.0" width="56.0" height="56.0" rx="0" fill="#fff3bf" stroke="none" stroke-width="0"/>
<rect x="500.0" y="156.0" width="56.0" height="100.0" rx="0" fill="#d0ebff" stroke="none" stroke-width="0"/>
<rect x="500" y="126" width="56" height="30" fill="url(#hatch)"/>
<rect x="500.0" y="100.0" width="56.0" height="156.0" rx="0" fill="none" stroke="#495057" stroke-width="1.3"/>
<line x1="494.0" y1="156.0" x2="570.0" y2="156.0" stroke="#c92a2a" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="494.0" y1="212.0" x2="570.0" y2="212.0" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="576.0" y="113.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">headroom: absorbs the bytes</text>
<text x="576.0" y="128.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">already on the cable, plus what</text>
<text x="576.0" y="142.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">the upstream sends before it reacts</text>
<text x="576.0" y="161.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c92a2a" font-weight="bold">XOFF: send PAUSE</text>
<text x="576.0" y="217.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f9e44" font-weight="bold">XON: send resume</text>
<text x="576.0" y="256.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">0</text>
<text x="20.0" y="300.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">headroom per port, per lossless priority ≈ 2 × cable delay × link rate + 2 × MTU + reaction time</text>
<text x="20.0" y="320.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">On a 300 m, 40 Gb/s link the cable term alone is ≈15 KB, and it is reserved on every port for every lossless priority.</text>
</svg>
