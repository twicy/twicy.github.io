<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff4e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e8590c" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="820" height="370" fill="#ffffff"/>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">The slow-receiver symptom: an address-translation miss in the NIC turns into a PAUSE</text>
<rect x="20.0" y="120.0" width="100.0" height="72.0" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
<text x="70.0" y="162.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">ToR</text>
<line x1="124.0" y1="138.0" x2="196.0" y2="138.0" stroke="#1971c2" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="160.0" y="130.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">packets</text>
<line x1="196.0" y1="176.0" x2="124.0" y2="176.0" stroke="#c92a2a" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="160.0" y="194.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c92a2a" font-weight="bold">PAUSE</text>
<circle cx="160.0" cy="212.0" r="9" fill="#c92a2a"/>
<text x="160.0" y="216.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">4</text>
<rect x="200.0" y="46.0" width="340.0" height="240.0" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="370.0" y="68.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">RDMA NIC</text>
<text x="235.0" y="98.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">RX buffer</text>
<rect x="220.0" y="106.0" width="30.0" height="156.0" rx="0" fill="#ffffff" stroke="#495057" stroke-width="1.3"/>
<rect x="220.0" y="136.0" width="30.0" height="126.0" rx="0" fill="#d0ebff" stroke="none" stroke-width="0"/>
<rect x="220" y="136" width="30" height="14" fill="url(#hatch)"/>
<rect x="220.0" y="106.0" width="30.0" height="156.0" rx="0" fill="none" stroke="#495057" stroke-width="1.3"/>
<line x1="216.0" y1="150.0" x2="254.0" y2="150.0" stroke="#c92a2a" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="256.0" y="154.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="bold">XOFF</text>
<circle cx="235.0" cy="80.0" r="9" fill="#c92a2a"/>
<text x="235.0" y="84.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">3</text>
<line x1="254.0" y1="166.0" x2="296.0" y2="166.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="300.0" y="126.0" width="150.0" height="56.0" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="1.4"/>
<text x="375.0" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">receive pipeline</text>
<text x="375.0" y="166.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">waits for the translation</text>
<circle cx="464.0" cy="126.0" r="9" fill="#c92a2a"/>
<text x="464.0" y="130.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">1</text>
<rect x="262.0" y="214.0" width="76.0" height="50.0" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1.2"/>
<text x="300.0" y="236.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">QPC</text>
<text x="300.0" y="252.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">QP contexts</text>
<rect x="344.0" y="214.0" width="76.0" height="50.0" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1.2"/>
<text x="382.0" y="236.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">WQE</text>
<text x="382.0" y="252.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">work requests</text>
<rect x="426.0" y="214.0" width="104.0" height="50.0" rx="4" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="478.0" y="236.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c92a2a" font-weight="bold">MTT: 2K entries</text>
<text x="478.0" y="252.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="normal">VA → PA, miss!</text>
<text x="396.0" y="279.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">on-NIC caches (small SRAM)</text>
<line x1="436.0" y1="182.0" x2="466.0" y2="211.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="534.0" y1="240.0" x2="610.0" y2="240.0" stroke="#c92a2a" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-red)"/>
<text x="573.0" y="214.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">PCIe</text>
<text x="573.0" y="228.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">Gen3 x8</text>
<text x="573.0" y="258.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">≈64 Gb/s</text>
<circle cx="573.0" cy="278.0" r="9" fill="#c92a2a"/>
<text x="573.0" y="282.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold">2</text>
<rect x="614.0" y="46.0" width="186.0" height="240.0" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="707.0" y="68.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">Host DRAM</text>
<rect x="626.0" y="90.0" width="162.0" height="34.0" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="707.0" y="112.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">QP contexts</text>
<rect x="626.0" y="134.0" width="162.0" height="34.0" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="707.0" y="156.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">work queue elements</text>
<rect x="626.0" y="178.0" width="162.0" height="34.0" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="707.0" y="200.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">data buffers (registered)</text>
<rect x="626.0" y="222.0" width="162.0" height="34.0" rx="4" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.3"/>
<text x="707.0" y="244.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c92a2a" font-weight="bold">full MTT (VA → PA)</text>
<text x="20.0" y="316.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">① a packet's target buffer needs a virtual-to-physical translation   ② the MTT cache misses, so the NIC reads the entry from host DRAM</text>
<text x="20.0" y="332.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">③ the pipeline stalls and the RX buffer crosses XOFF   ④ the NIC pauses its ToR, and the pause can spread from there</text>
<text x="20.0" y="356.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">MTT reach: 2,048 entries × 4 KB pages = 8 MB;  2,048 × 2 MB pages = 4 GB</text>
</svg>
