<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff4e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e8590c" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="820" height="470" fill="#ffffff"/>
<text x="20.0" y="26.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529" font-weight="bold">(a) VLAN-based PFC: the priority rides in the 802.1Q tag</text>
<rect x="20.0" y="38.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="55.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Dst MAC</text>
<rect x="90.0" y="38.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="125.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Src MAC</text>
<rect x="160.0" y="38.0" width="90.0" height="34.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="205.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">802.1Q tag</text>
<rect x="250.0" y="38.0" width="80.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="290.0" y="52.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">EtherType</text>
<text x="290.0" y="65.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">0x0800</text>
<rect x="330.0" y="38.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="365.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">IPv4</text>
<rect x="400.0" y="38.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="445.0" y="52.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">UDP</text>
<text x="445.0" y="65.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">dport 4791</text>
<rect x="490.0" y="38.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="525.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">IB BTH</text>
<rect x="560.0" y="38.0" width="130.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="625.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">payload</text>
<rect x="690.0" y="38.0" width="50.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="715.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">ICRC</text>
<rect x="740.0" y="38.0" width="50.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="765.0" y="59.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">FCS</text>
<line x1="160.0" y1="72.0" x2="120.0" y2="98.0" stroke="#868e96" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="250.0" y1="72.0" x2="560.0" y2="98.0" stroke="#868e96" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="120.0" y="98.0" width="150.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="195.0" y="112.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">TPID 0x8100</text>
<text x="195.0" y="125.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">16 bits</text>
<rect x="270.0" y="98.0" width="80.0" height="34.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="310.0" y="112.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">PCP</text>
<text x="310.0" y="125.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">3 bits</text>
<rect x="350.0" y="98.0" width="60.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="380.0" y="112.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">DEI</text>
<text x="380.0" y="125.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">1 bit</text>
<rect x="410.0" y="98.0" width="150.0" height="34.0" rx="0" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.3"/>
<text x="485.0" y="112.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">VID (VLAN ID)</text>
<text x="485.0" y="125.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">12 bits</text>
<text x="20.0" y="156.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">PCP is the priority PFC needs, but it only exists inside a VLAN tag: server-facing switch ports must be</text>
<text x="20.0" y="171.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">trunks (which breaks PXE boot), and a router rebuilds the Ethernet header, tag included, at every hop.</text>
<text x="20.0" y="206.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529" font-weight="bold">(b) DSCP-based PFC: the priority rides in the IP header</text>
<rect x="20.0" y="218.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="55.0" y="239.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Dst MAC</text>
<rect x="90.0" y="218.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="125.0" y="239.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Src MAC</text>
<rect x="160.0" y="218.0" width="80.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="200.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">EtherType</text>
<text x="200.0" y="245.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">0x0800</text>
<rect x="240.0" y="218.0" width="110.0" height="34.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="295.0" y="239.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">IPv4 header</text>
<rect x="350.0" y="218.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="395.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">UDP</text>
<text x="395.0" y="245.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">dport 4791</text>
<rect x="440.0" y="218.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="475.0" y="239.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">IB BTH</text>
<rect x="510.0" y="218.0" width="160.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="590.0" y="239.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">payload</text>
<rect x="670.0" y="218.0" width="50.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="695.0" y="239.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">ICRC</text>
<rect x="720.0" y="218.0" width="50.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="745.0" y="239.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">FCS</text>
<line x1="240.0" y1="252.0" x2="150.0" y2="284.0" stroke="#868e96" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="350.0" y1="252.0" x2="580.0" y2="284.0" stroke="#868e96" stroke-width="1" stroke-dasharray="3 3"/>
<text x="360.0" y="279.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">ToS / Traffic Class byte</text>
<rect x="150.0" y="284.0" width="120.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="210.0" y="305.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">… IPv4 fields</text>
<rect x="270.0" y="284.0" width="110.0" height="34.0" rx="0" fill="#d0ebff" stroke="#1971c2" stroke-width="1.3"/>
<text x="325.0" y="298.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">DSCP</text>
<text x="325.0" y="311.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">6 bits</text>
<rect x="380.0" y="284.0" width="70.0" height="34.0" rx="0" fill="#fff4e6" stroke="#e8590c" stroke-width="1.3"/>
<text x="415.0" y="298.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">ECN</text>
<text x="415.0" y="311.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">2 bits</text>
<rect x="450.0" y="284.0" width="130.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="515.0" y="305.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">… IPv4 fields</text>
<text x="20.0" y="342.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">DSCP selects the PFC priority (Microsoft maps DSCP i to priority i); ECN carries DCQCN's congestion marks.</text>
<text x="20.0" y="357.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">No VLAN tag at all: server ports stay in access mode, and IP routing carries the byte end to end.</text>
<text x="20.0" y="392.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529" font-weight="bold">PFC pause frame: the same in (a) and (b); it never had a VLAN tag</text>
<rect x="20.0" y="404.0" width="140.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="90.0" y="418.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Dst MAC</text>
<text x="90.0" y="431.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">01:80:C2:00:00:01</text>
<rect x="160.0" y="404.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="195.0" y="425.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Src MAC</text>
<rect x="230.0" y="404.0" width="80.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="270.0" y="418.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">EtherType</text>
<text x="270.0" y="431.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">0x8808</text>
<rect x="310.0" y="404.0" width="70.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="345.0" y="418.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">opcode</text>
<text x="345.0" y="431.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">0x0101</text>
<rect x="380.0" y="404.0" width="100.0" height="34.0" rx="0" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.3"/>
<text x="430.0" y="418.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">priority</text>
<text x="430.0" y="431.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">enable vector</text>
<rect x="480.0" y="404.0" width="160.0" height="34.0" rx="0" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.3"/>
<text x="560.0" y="418.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">8 pause timers</text>
<text x="560.0" y="431.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">unit: 512 bit times</text>
<rect x="640.0" y="404.0" width="60.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="670.0" y="425.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">pad</text>
<rect x="700.0" y="404.0" width="50.0" height="34.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="725.0" y="425.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">FCS</text>
<text x="800.0" y="462.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#868e96" font-weight="normal" font-style="italic">fields not to scale</text>
</svg>
