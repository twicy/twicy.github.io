<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 326" width="820" height="326" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff4e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e8590c" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="820" height="326" fill="#ffffff"/>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">Three checksums on a TCP/IPv4 packet: checksum offload moves two of them to the NIC</text>
<rect x="326.0" y="38.0" width="68.0" height="16.0" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.1"/>
<text x="360.0" y="50.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2f9e44" font-weight="bold">offloaded</text>
<rect x="446.0" y="38.0" width="68.0" height="16.0" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.1"/>
<text x="480.0" y="50.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2f9e44" font-weight="bold">offloaded</text>
<rect x="724.0" y="38.0" width="72.0" height="16.0" rx="8" fill="#e5dbff" stroke="#7048e8" stroke-width="1.1"/>
<text x="760.0" y="50.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7048e8" font-weight="bold">always NIC</text>
<rect x="210.0" y="60.0" width="90.0" height="38.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="255.0" y="76.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">Ethernet</text>
<text x="255.0" y="90.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">header</text>
<rect x="300.0" y="60.0" width="120.0" height="38.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="360.0" y="75.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">IPv4 header</text>
<rect x="330.0" y="81.0" width="60.0" height="13.0" rx="2" fill="#fff4e6" stroke="#e8590c" stroke-width="1.1"/>
<text x="360.0" y="91.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#e8590c" font-weight="bold">checksum</text>
<rect x="420.0" y="60.0" width="120.0" height="38.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="480.0" y="75.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">TCP header</text>
<rect x="450.0" y="81.0" width="60.0" height="13.0" rx="2" fill="#d0ebff" stroke="#1971c2" stroke-width="1.1"/>
<text x="480.0" y="91.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1971c2" font-weight="bold">checksum</text>
<rect x="540.0" y="60.0" width="190.0" height="38.0" rx="0" fill="#ffffff" stroke="#868e96" stroke-width="1.3"/>
<text x="635.0" y="83.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">payload</text>
<rect x="730.0" y="60.0" width="60.0" height="38.0" rx="0" fill="#e5dbff" stroke="#7048e8" stroke-width="1.3"/>
<text x="760.0" y="83.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7048e8" font-weight="bold">FCS</text>
<path d="M 420 116 L 420 124 L 730 124 L 730 116" fill="none" stroke="#1971c2" stroke-width="1.8"/>
<text x="20.0" y="126.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1971c2" font-weight="bold">L4: TCP checksum</text>
<text x="20.0" y="141.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">16-bit ones'-complement sum</text>
<text x="20.0" y="155.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2f9e44" font-weight="bold">offloaded: kernel → NIC</text>
<text x="575.0" y="141.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">TCP header + payload</text>
<text x="575.0" y="155.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">plus a pseudo-header: IP addresses, protocol, length</text>
<path d="M 300 182 L 300 190 L 420 190 L 420 182" fill="none" stroke="#e8590c" stroke-width="1.8"/>
<text x="20.0" y="192.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8590c" font-weight="bold">L3: IPv4 header checksum</text>
<text x="20.0" y="207.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">16-bit ones'-complement sum</text>
<text x="20.0" y="221.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2f9e44" font-weight="bold">offloaded: kernel → NIC</text>
<text x="360.0" y="207.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">IPv4 header only</text>
<text x="360.0" y="221.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">recomputed by every router, as the TTL changes</text>
<path d="M 210 248 L 210 256 L 730 256 L 730 248" fill="none" stroke="#7048e8" stroke-width="1.8"/>
<text x="20.0" y="258.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7048e8" font-weight="bold">L2: Ethernet FCS</text>
<text x="20.0" y="273.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">CRC-32</text>
<text x="20.0" y="287.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7048e8" font-weight="bold">never software: NIC MAC</text>
<text x="470.0" y="273.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">the whole frame: headers and payload</text>
<text x="20.0" y="314.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">With offload: on transmit, the NIC fills in the L3 and L4 fields that the kernel left blank; on receive, it checks them and reports the result.</text>
</svg>
