<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 226" width="820" height="226" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="820" height="226" fill="#ffffff"/>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">The life of a sequence in the scheduler</text>
<rect x="60.0" y="110.0" width="150.0" height="50.0" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="135.0" y="133.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">WAITING</text>
<text x="135.0" y="150.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#495057" font-weight="normal">self.waiting</text>
<rect x="350.0" y="110.0" width="150.0" height="50.0" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.8"/>
<text x="425.0" y="133.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">RUNNING</text>
<text x="425.0" y="150.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#495057" font-weight="normal">self.running</text>
<rect x="640.0" y="110.0" width="150.0" height="50.0" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.8"/>
<text x="715.0" y="133.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">FINISHED</text>
<text x="715.0" y="150.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#495057" font-weight="normal">in neither queue</text>
<line x1="135.0" y1="62.0" x2="135.0" y2="107.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="135.0" y="56.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">new request</text>
<line x1="212.0" y1="126.0" x2="347.0" y2="126.0" stroke="#212529" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="280.0" y="104.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">prefill</text>
<text x="280.0" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">computes all its K and V</text>
<line x1="348.0" y1="146.0" x2="213.0" y2="146.0" stroke="#c92a2a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="280.0" y="166.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c92a2a" font-weight="bold">preempted</text>
<text x="280.0" y="180.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">blocks freed, back to the front</text>
<path d="M 400 108 C 395 66, 455 66, 450 107" fill="none" stroke="#212529" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="425.0" y="60.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">decode: one token per step</text>
<line x1="502.0" y1="135.0" x2="637.0" y2="135.0" stroke="#212529" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="570.0" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="bold">&lt;eos&gt; or max_tokens</text>
<text x="570.0" y="154.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">blocks freed</text>
<text x="135.0" y="206.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">no K and V in the cache yet</text>
<text x="425.0" y="206.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">K and V in its own blocks</text>
<text x="715.0" y="206.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">result returned</text>
</svg>
