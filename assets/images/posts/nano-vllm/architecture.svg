<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff5f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="1.4"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="820" height="420" fill="#ffffff"/>
<rect x="16.0" y="40.0" width="384.0" height="316.0" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
<rect x="420.0" y="40.0" width="384.0" height="316.0" rx="10" fill="#f3f9ff" stroke="#a5d8ff" stroke-width="1.2"/>
<text x="32.0" y="64.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529" font-weight="bold">CPU: decides what runs, and where its K and V go</text>
<text x="436.0" y="64.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212529" font-weight="bold">GPU: executes, following those addresses</text>
<text x="20.0" y="24.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">Nano-vLLM at a glance: one step of the loop</text>
<rect x="36.0" y="80.0" width="344.0" height="46.0" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
<text x="48.0" y="99.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">LLMEngine.step()</text>
<text x="48.0" y="116.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">the loop: schedule, run, postprocess</text>
<rect x="36.0" y="142.0" width="344.0" height="46.0" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
<text x="48.0" y="161.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">Scheduler</text>
<text x="48.0" y="178.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">waiting and running queues; picks this step's sequences</text>
<rect x="36.0" y="204.0" width="344.0" height="46.0" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
<text x="48.0" y="223.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">BlockManager + Sequences</text>
<text x="48.0" y="240.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">block tables, ref counts, prefix-cache hashes, free list</text>
<rect x="36.0" y="266.0" width="344.0" height="58.0" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
<text x="48.0" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">ModelRunner.prepare_prefill / prepare_decode</text>
<text x="48.0" y="302.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">input_ids, positions, slot_mapping, cu_seqlens,</text>
<text x="48.0" y="317.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">block tables: copied to the GPU each step</text>
<line x1="208.0" y1="127.0" x2="208.0" y2="141.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="208.0" y1="189.0" x2="208.0" y2="203.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="208.0" y1="251.0" x2="208.0" y2="265.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="440.0" y="80.0" width="210.0" height="46.0" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="1.5"/>
<text x="452.0" y="99.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">Sampler</text>
<text x="452.0" y="116.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">one token id per sequence</text>
<rect x="440.0" y="142.0" width="210.0" height="46.0" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="1.5"/>
<text x="452.0" y="161.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">LM head</text>
<text x="452.0" y="178.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">logits, last position only</text>
<rect x="440.0" y="204.0" width="210.0" height="120.0" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="1.5"/>
<text x="452.0" y="223.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">Qwen3 model, 28 layers</text>
<text x="452.0" y="240.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">eager, or a CUDA graph for decode</text>
<text x="452.0" y="262.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal">each attention layer:</text>
<text x="452.0" y="278.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">1. write new K, V at their slots</text>
<text x="452.0" y="294.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#212529" font-weight="normal">2. read K, V via block tables</text>
<line x1="545.0" y1="142.0" x2="545.0" y2="128.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="545.0" y1="204.0" x2="545.0" y2="190.0" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="668.0" y="204.0" width="120.0" height="120.0" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="728.0" y="228.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="bold">kv_cache</text>
<text x="728.0" y="246.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">one tensor,</text>
<text x="728.0" y="260.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal">allocated once</text>
<text x="728.0" y="282.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#495057" font-weight="normal">[2, 28, blocks,</text>
<text x="728.0" y="296.0" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#495057" font-weight="normal">256, 8, 128]</text>
<line x1="652.0" y1="270.0" x2="666.0" y2="270.0" stroke="#2f9e44" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="666.0" y1="290.0" x2="652.0" y2="290.0" stroke="#2f9e44" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="382.0" y1="295.0" x2="437.0" y2="295.0" stroke="#212529" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="410.0" y="287.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#212529" font-weight="bold">tensors</text>
<line x1="438.0" y1="103.0" x2="383.0" y2="103.0" stroke="#212529" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="410.0" y="95.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#212529" font-weight="bold">token ids</text>
<text x="20.0" y="384.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">The CPU never touches K or V: it only decides where they go (block tables and slots).</text>
<text x="20.0" y="403.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#212529" font-weight="normal">The GPU never decides anything: it follows the addresses it is given.</text>
</svg>
