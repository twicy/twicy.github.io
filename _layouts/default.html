<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

{% include navigation.html %}

<div class="site-body wrap">
  <aside class="sidebar" aria-label="About {{ site.owner.name }}">
    {% include author-bio.html %}
  </aside>

  <main id="content" class="main">
    <article class="content{% if page.class %} {{ page.class }}{% endif %}">
      {% unless layout.hide_title %}{% if page.title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}{% endunless %}
      {{ content | replace: '<img src=', '<img loading="lazy" decoding="async" src=' }}
    </article>
    {% if layout.comments and page.comments != false %}{% include comments.html %}{% endif %}
  </main>
</div>

{% include footer.html %}
{% include scripts.html %}
</body>
</html>
