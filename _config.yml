title: Yuchen Tang
author: Yuchen Tang
# Feed subtitle. Setting it here also keeps local builds from querying the GitHub API.
description: Projects, publications and blog posts on systems, networking and GPU programming.
# GitHub Pages sets `url` automatically (https://twicy.github.io).

# Owner/author information, shown in the sidebar.
# Optional keys: bio, scholar (full Google Scholar URL), orcid (iD), twitter (handle).
owner:
  name: Yuchen Tang
  avatar: /assets/images/site/avatar.jpg
  email: garretttang@outlook.com
  cv: /files/Yuchen_Tang_20251202.pdf
  orcid: "0009-0005-7301-5101"
  github: twicy
  linkedin: yuchen-tang-b49a37190

# Google Search Console verification
google_verify: "bXA3lQw9buDJZH2NwblukCeAtGopATq9dzbDNkMHwVs"
# bing_verify: ""

# Top navigation. For external links add `external: true`.
links:
  - title: About Me
    url: /
  - title: Projects
    url: /projects/
  - title: Blogs
    url: /blogs/
  - title: Publications
    url: /publications/
  - title: Services
    url: /services/

# Blog post topics, in the order the Blogs page lists them.
# Posts without a `topic` are listed under the last one.
blog_topics:
  - Operating System and Kernel Bypassing
  - GPU and CUDA
  - Other

timezone: America/Los_Angeles
future: true
highlighter: rouge
permalink: /:categories/:title

plugins:
  - jekyll-feed    # /feed.xml (Atom) of the blog posts
  - jekyll-sitemap # /sitemap.xml and /robots.txt

defaults:
  - scope:
      type: posts
    values:
      layout: page
      permalink: /blogs/:title.html # e.g. _posts/2026-11-01-foo.md -> /blogs/foo.html
  - scope:
      path: google491f5d38f903eb47.html
    values:
      sitemap: false

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  math_engine: mathjax
  syntax_highlighter: rouge

# Projects, Publications, Services and the Blogs index; their URLs come from `permalink`.
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .idea
  - README.md
  - TODO.md # local notes (git-ignored), never published
